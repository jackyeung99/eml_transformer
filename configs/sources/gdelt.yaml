    - WB_1033_SOLAR_POWER_LAW_AND_REGULATION
    - WB_1871_HYDROPOWER_LAW_AND_REGULATION
    - WB_1034_WIND_POWER_LAW_AND_REGULATION

  target_organizations:
    - MISO
    - Midcontinent Independent System Operator
    - PJM
    - SPP
    - ERCOT
    - NERC
    - FERC
    - Duke Energy
    - American Electric Power
    - AEP
    - Xcel Energy
    - Ameren
    - DTE Energy
    - Consumers Energy
    - Alliant Energy
    - Entergy
    - CenterPoint Energy
    - Great River Energy
    - Dairyland Power
    - Basin Electric
    - Southern Company

  target_locations:
    - USIN
    - USIL
    - USMI
    - USOH
    - USKY
    - USWI
    - USMN
    - USIA
    - USMO
    - USAR
    - USLA
    - USMS
    - USND
    - USSD

standardization:
  output: silver:gdelt:records
  batch_size: 100000
  write_mode: replace

scraping:
  enabled: true
  input: silver:gdelt:records
  output: silver:gdelt:articles
  url_column: url
  timeout: 30
  batch_size: 100
  max_concurrency: 5

embedding:
  enabled: true
  input: silver:gdelt:articles
  output: gold:gdelt:embeddings
  write_mode: append
  embedding_batch_size: 32
  text_columns:
    - title
    - text