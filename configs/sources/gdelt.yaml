    - MANMADE_DISASTER_WITHOUT_ELECTRICITY
    - ECON_ELECTRICALGRID
    - ENV_WINDPOWER
    - WB_508_POWER_SYSTEMS
    - WB_527_HYDROPOWER
    - ENV_NUCLEARPOWER
