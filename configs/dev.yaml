storage:
  backend: local
  root: .

sources:
  iem_afos:
    enabled: true
    config: sources/iem_afos.yaml
    stages:
      - ingest
      - backfill
      - standardize
      - embed

  miso_notifications:
    enabled: true
    config: sources/miso_notifications.yaml
    stages: 
      - ingest
      - standardize
      - embed

  gdelt:
    enabled: true
    config: sources/gdelt.yaml
    stages:
      - ingest
      - backfill
      - standardize
      - scrape
      - embed

  eia_region:
    enabled: true
    config: sources/eia_region.yaml
    stages:
      - ingest
      - backfill
      - standardize

  eia_interchange:
    enabled: true
    config: sources/eia_interchange.yaml
    stages:
      - ingest
      - backfill
      - standardize

  newsapi:
    enabled: false
    config: sources/news_api.yaml
    stages:
      - ingest
      - standardize
      - embed

  weather_alerts:
    enabled: false
    config: sources/weather_alerts.yaml
    stages:
      - ingest
      - standardize
      - embed


embeddings:
  provider: sentence_transformer
  model: nvidia/llama-nemotron-embed-vl-1b-v2
  batch_size: 32
  device: cuda
  normalize_embeddings: true
  trust_remote_code: true
  text_columns:
    - title
    - text

features:
  eia_region_hourly:
    input: silver:eia930_region:records
    output: gold:eia930_region_hourly:features
    builder: eia_region_hourly

  eia_region_daily:
    input: silver:eia930_region:records
    output: gold:eia930_region_daily:features
    builder: eia_region_daily

  eia_interchange_hourly:
    input: silver:eia930_interchange:records
    output: gold:eia930_interchange_hourly:features
    builder: eia_interchange_hourly
  
  eia_interchange_daily:
    input: silver:eia930_interchange:records
    output: gold:eia930_interchange_daily:features
    builder: eia_interchange_daily

datasets:
  hourly_load:
    builder: hourly_load_forecasting
    inputs:
      region_features: gold:eia930_region_hourly:features
      interchange_features: gold:eia930_interchange_hourly:features
    output: gold:hourly_load:datasets

  daily_load:
    builder: daily_load_forecasting
    inputs:
      region_daily_features: gold:eia930_region_daily:features
      interchange_daily_features: gold:eia930_interchange_daily:features
    output: gold:daily_load:datasets


modeling:
  miso_hourly_load_sarimax:
    enabled: true
    model_type: sarimax

    training_input: gold:hourly_load:datasets
    forecast_input: gold:hourly_load:datasets

    model_output: miso_hourly_load_sarimax
    forecast_output: gold:miso_hourly_load_sarimax:forecasts

    target: actual_load

    # Known-future calendar features are generated from each
    # forecast timestamp in the forecasting layer.
    features:
      - hour
      - day_of_week
      - is_weekend
      - month

    retrain_after_hours: 168

    hyper_parameters:
      order:
        - 1
        - 1
        - 1
      seasonal_order:
        - 1
        - 0
        - 1
        - 24
      trend: null
      use_exogenous: true
      enforce_stationarity: true
      enforce_invertibility: true
      simple_differencing: false

    training_settings:
      timestamp_column: observed_at
      lookback_days: 730
      validation_days: 14

    forecast_settings:
      # Full hourly load curve:
      forecast_steps: 24
      frequency: 1h

  miso_daily_peak_arima:
    enabled: true
    model_type: arima

    training_input: gold:daily_load:datasets
    forecast_input: gold:daily_load:datasets

    model_output: miso_daily_peak_arima
    forecast_output: gold:miso_daily_peak_arima:forecasts

    target: load_max
    features: []

    retrain_after_hours: 168

    hyper_parameters:
      order:
        - 2
        - 1
        - 2
      trend: null
      use_exogenous: false
      enforce_stationarity: true
      enforce_invertibility: true

    training_settings:
      timestamp_column: observed_at
      lookback_days: 1825
      validation_days: 30

    forecast_settings:
      forecast_steps: 3
      frequency: 1d