storage:
  backend: local
  root: .

sources:
  iem_afos:
    enabled: true
    config: sources/iem_afos.yaml
    stages:
      - ingest
      - backfill
      - standardize
      - embed

  miso_notifications:
    enabled: true
    config: sources/miso_notifications.yaml
    stages: 
      - ingest
      - standardize
      - embed

  gdelt:
    enabled: true
    config: sources/gdelt.yaml
    stages:
      - ingest
      - backfill
      - standardize
      - scrape
      - embed

  eia_region:
    enabled: true
    config: sources/eia_region.yaml
    stages:
      - ingest
      - backfill
      - standardize

  eia_interchange:
    enabled: true
    config: sources/eia_interchange.yaml
    stages:
      - ingest
      - backfill
      - standardize

  newsapi:
    enabled: false
    config: sources/news_api.yaml
    stages:
      - ingest
      - standardize
      - embed

  weather_alerts:
    enabled: false
    config: sources/weather_alerts.yaml
    stages:
      - ingest
      - standardize
      - embed


embeddings:
  provider: sentence_transformer
  model: nvidia/llama-nemotron-embed-vl-1b-v2
  batch_size: 32
  device: cuda
  normalize_embeddings: true
  trust_remote_code: true
  text_columns:
    - title
    - text

features:
  eia_region_hourly:
    input: silver:eia930_region:records
    output: gold:eia930_region_hourly:features
    builder: eia_region_hourly

  eia_region_daily:
    input: silver:eia930_region:records
    output: gold:eia930_region:features
    builder: eia_region_daily

  eia_interchange_hourly:
    input: silver:eia930_interchange:records
    output: gold:eia930_interchange_hourly:features
    builder: eia_interchange

datasets:
  load_forecasting:
    builder: load_forecasting
    inputs:
      region_features: gold:eia930_region_hourly:features
      interchange_features: gold:eia930_interchange_hourly:features
    output: gold:load_forecasting:datasets

modeling:
  miso_hourly_load_ridge:
    enabled: true
    model_type: ridge

    training_input: gold:load_forecasting:datasets
    forecast_input: gold:load_forecasting:datasets

    model_output: miso_hourly_load_ridge
    forecast_output: gold:miso_hourly_load_ridge:forecasts

    target: actual_load

    features:
      - hour
      - month
      - is_weekend
      - is_holiday
      - actual_load_lag_24
      - actual_load_lag_168
      - total_exports_lag_24
      - total_imports_lag_24

    retrain_after_hours: 168

    hyper_parameters:
      alpha: 1.0
      fit_intercept: true
      scale_features: true
      solver: auto
      tolerance: 0.0001
      max_iter: null

    training_settings:
      timestamp_column: observed_at
      lookback_days: 730
      validation_days: 14

  miso_hourly_load_arima:
    enabled: true
    model_type: arima

    training_input: gold:load_forecasting:datasets
    forecast_input: gold:load_forecasting:datasets

    model_output: miso_hourly_load_arima
    forecast_output: gold:miso_hourly_load_arima:forecasts

    target: actual_load

    features:
      - hour
      - month
      - is_weekend
      - is_holiday
      - actual_load_lag_24
      - actual_load_lag_168
      - total_exports_lag_24
      - total_imports_lag_24

    retrain_after_hours: 168

    hyper_parameters:
      order:
        - 2
        - 1
        - 2
      trend: null
      use_exogenous: true
      enforce_stationarity: true
      enforce_invertibility: true

    training_settings:
      timestamp_column: observed_at
      lookback_days: 730
      validation_days: 14

  miso_hourly_load_sarimax:
    enabled: true
    model_type: sarimax

    training_input: gold:load_forecasting:datasets
    forecast_input: gold:load_forecasting:datasets

    model_output: miso_hourly_load_sarimax
    forecast_output: gold:miso_hourly_load_sarimax:forecasts

    target: actual_load

    features:
      - hour
      - month
      - is_weekend
      - is_holiday
      - actual_load_lag_24
      - actual_load_lag_168
      - total_exports_lag_24
      - total_imports_lag_24

    retrain_after_hours: 168

    hyper_parameters:
      order:
        - 1
        - 1
        - 1
      seasonal_order:
        - 1
        - 0
        - 1
        - 24
      trend: null
      use_exogenous: true
      enforce_stationarity: true
      enforce_invertibility: true
      simple_differencing: false

    training_settings:
      timestamp_column: observed_at
      lookback_days: 730
      validation_days: 14