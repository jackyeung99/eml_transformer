storage:
  backend: local
  base_dir: data

paths:
  root: .

defaults:
  embedding_input: records

sources:
  iem_afos:
    enabled: true
    config: sources/iem_afos.yaml

  miso_notifications:
    enabled: true
    config: sources/miso_notifications.yaml

  gdelt:
    enabled: true
    config: sources/gdelt.yaml

  newsapi:
    enabled: false
    config: sources/news_api.yaml

  weather_alerts:
    enabled: false
    config: sources/weather_alerts.yaml

  eia_region:
    enabled: true
    config: sources/eia_region.yaml

  eia_interchange:
    enabled: true
    config: sources/eia_interchange.yaml


 

embeddings:
  provider: sentence_transformer
  model: nvidia/llama-nemotron-embed-vl-1b-v2
  batch_size: 32
  device: cuda
  normalize_embeddings: true
  trust_remote_code: true
  text_columns:
    - title
    - text